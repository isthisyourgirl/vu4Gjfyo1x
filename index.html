<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⭐Helloo store⭐</title>

<meta name="description" content="Helloo store - Video and community links.">
<meta name="theme-color" content="#eef2f5">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
    padding: 20px 12px;
    background: linear-gradient(180deg, #eef2f5 0%, #e3e9ef 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, Arial, sans-serif;
    color: #222;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
}

.post {
    width: 100%;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.09);
}

.cover {
    width: 100%;
    overflow: hidden;
    background: #111827;
}

.cover img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
    object-fit: cover;
}

.content {
    padding: 20px 14px 18px;
}

.title {
    margin-bottom: 6px;
    color: #172033;
    font-size: 21px;
    line-height: 1.4;
    font-weight: 800;
    text-align: center;
}

.subtitle {
    margin-bottom: 18px;
    color: #697386;
    font-size: 14px;
    line-height: 1.5;
    text-align: center;
}

/* BUTTONS */

.button-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
}

.link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 52px;
    padding: 13px 10px;
    border: none;
    border-radius: 11px;

    color: #fff;
    text-align: center;
    text-decoration: none;

    font-size: 14px;
    line-height: 1.4;
    font-weight: 800;
    letter-spacing: 0.2px;

    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.10);

    transition: filter 0.15s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
}

.link:hover {
    filter: brightness(1.08);
}

.link:active {
    transform: scale(0.985);
}

.link:focus-visible {
    outline: 3px solid #111827;
    outline-offset: 3px;
}

/* BUTTON COLORS */

.video-button {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.full-video-button {
    background: linear-gradient(135deg, #7c3aed, #5b21b6);
}

.group-button {
    background: linear-gradient(135deg, #16a34a, #15803d);
}

/* FOOTER */

.footer {
    margin-top: 18px;
    padding-top: 13px;
    border-top: 1px solid #edf0f4;

    color: #8992a2;
    font-size: 12px;
    line-height: 1.6;
    text-align: center;
}

/* MOBILE */

@media (max-width: 360px) {
    body {
        padding: 12px 8px;
    }

    .content {
        padding: 17px 12px 15px;
    }

    .title {
        font-size: 19px;
    }

    .link {
        min-height: 49px;
        font-size: 13px;
    }
}

/* REDUCED MOTION */

@media (prefers-reduced-motion: reduce) {
    .link {
        transition: none;
    }
}
</style>
</head>

<body>

<div class="container">

    <main class="post">

        <!-- COVER IMAGE -->

        <div class="cover">
            <img
                src="https://cdn.imgso.co/taNl7OhWT.jpg"
                alt="Helloo store Cover"
                fetchpriority="high">
        </div>

        <div class="content">

            <h1 class="title">🎥 Video</h1>

            <p class="subtitle">
                Choose an option below 👇
            </p>

            <!-- NAVIGATION BUTTONS -->

            <div class="button-list">

                <a
                    class="link video-button"
                    href="https://issthisyourgirlbro.blogspot.com/2026/11/helloo-store-1.html"
                    target="_blank"
                    rel="noopener noreferrer">
                    ▶️ WATCH VIDEO
                </a>

                <a
                    class="link full-video-button"
                    href="https://midnightmenaces.blogspot.com/"
                    target="_blank"
                    rel="noopener noreferrer">
                    🎬 FULL VIDEO
                </a>

                <a
                    class="link group-button"
                    href="https://www.facebook.com/groups/bbwsinglesfan"
                    target="_blank"
                    rel="noopener noreferrer">
                    👥 JOIN ALTERNATIVE GROUP
                </a>

            </div>

            <!-- FOOTER -->

            <div class="footer">
                ❤️ HD Quality • Mobile Friendly • Fast Loading
            </div>

        </div>

    </main>

</div>

</html>
